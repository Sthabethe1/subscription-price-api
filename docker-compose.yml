services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: subprice
      POSTGRES_PASSWORD: subprice
      POSTGRES_DB: subprice
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subprice"]
      interval: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://subprice:subprice@db:5432/subprice
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
volumes:
  pgdata:
